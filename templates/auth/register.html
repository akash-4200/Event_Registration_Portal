{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card auth-card">
    <h2>Create your account</h2>
    <form method="POST" data-validate>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
        </div>
        <div class="form-group">
            <label for="role">I am a</label>
            <select id="role" name="role" required>
                <option value="student" {% if form.get('role') == 'student' %}selected{% endif %}>Student</option>
                <option value="organizer" {% if form.get('role') == 'organizer' %}selected{% endif %}>Organizer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="department">Department (optional)</label>
            <input type="text" id="department" name="department" value="{{ form.get('department', '') }}" placeholder="e.g. Computer Science">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            </div>
        </div>
        <p class="form-hint">Password must be at least 8 characters.</p>
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    </form>
    <hr class="divider">
    <p class="text-center text-muted mb-0">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
</div>
{% endblock %}
